name: preprocessing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
    CSV_URL: "./heart_disease.csv"

#jobs:
  #preprocess:
    #runs-on: ubuntu-latest

    #steps:
    #- name: Checkout repository
      #uses: actions/checkout@v3

jobs:
  preprocess:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the workflow to push changes back to the repo
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Install dependencies
      run: pip install numpy pandas matplotlib seaborn missingno scikit-learn 

    - name: Run preprocessing
      run: python preprocessing/automate_Hendy.py

    #- name: Commit and push preprocessed files
      #run: |
        git config --global user.name ${{ secrets.USERNAME }}
        git config --global user.email ${{ secrets.EMAIL }}
        #git add preprocessing/heart_disease_preprocessed.csv
        #git add .
        
        # Cek apakah ada perubahan yang staged
        #if [ -n "$(git diff --cached --name-only)" ]; then
          #git commit -m "Auto update preprocessed data"
          #git push
        #else
          #echo "Tidak ada perubahan pada file preprocessing"
        #fi

    - name: Commit and push preprocessed files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add .
        
        # Only commit if there are actually changes to avoid another exit code 1 error
        git diff-index --quiet HEAD || git commit -m "Update preprocessed files"
        
        git push
